  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141310; }
    /* Installed on an iPhone (standalone, black-translucent status bar) the page runs under the
       notch, the status bar and the home indicator: keep the canvas inside the safe area. */
    #brahma_canvas { position: absolute; display: block;
      top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #brahma_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b2aea4; font: 14px system-ui, sans-serif; pointer-events: none; }
    #brahma_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #brahma_loading a { color: #c9a85a; pointer-events: auto; }
    #brahma_bar { width: 220px; height: 3px; margin: 6px 0 10px; border-radius: 2px; background: #2a2823; overflow: hidden; }
    #brahma_bar_fill { width: 0; height: 100%; border-radius: 2px; background: #c9a85a; transition: width 120ms ease-out; }
    #brahma_progress { color: #7e7a70; font-size: 12px; font-variant-numeric: tabular-nums; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #brahma_stalled { color: #7e7a70; visibility: hidden; animation: brahma-stalled 0s 20s forwards; }
    @keyframes brahma-stalled { to { visibility: visible; } }
    /* The wait has motion that means something: the light comes up, the name rises, a gold sweep
       crosses it while the download runs, and the bar shimmers until real progress arrives. */
    #brahma_halo { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -430px 0 0 -380px;
      border-radius: 50%; background: radial-gradient(closest-side, rgba(201,168,90,0.10) 0%, rgba(201,168,90,0.075) 22%, rgba(201,168,90,0.045) 45%, rgba(201,168,90,0.022) 65%, rgba(201,168,90,0.008) 82%, rgba(201,168,90,0) 100%);
      opacity: 0; animation: brahma-light 1.2s ease-out 0.05s forwards, brahma-breathe 5.5s ease-in-out 1.3s infinite; }
    #brahma_mark { margin: 0 0 6px; font: 600 44px/1.1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.01em;
      color: #ece7dc; background: linear-gradient(100deg, #ece7dc 0%, #ece7dc 40%, #e8c97a 50%, #ece7dc 60%, #ece7dc 100%);
      background-size: 260% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; opacity: 0; transform: translateY(10px);
      animation: brahma-rise 0.7s cubic-bezier(.2,.9,.25,1.08) 0.15s forwards, brahma-sweep 2.8s ease-in-out 0.9s infinite; }
    #brahma_rule { width: 48px; height: 1.5px; margin: 4px 0 14px; background: #c9a85a; opacity: 0.85; transform: scaleX(0);
      animation: brahma-draw 0.6s cubic-bezier(.2,.9,.25,1) 0.55s forwards; }
    #brahma_word { margin: 0 0 4px; color: #7e7a70; font-size: 12px; letter-spacing: 0.14em; text-transform: lowercase; }
    #brahma_loading > * { position: relative; }
    #brahma_loading > #brahma_halo { position: absolute; }
    #brahma_bar::after { content: ""; position: absolute; inset: 0; width: 40%;
      background: linear-gradient(90deg, rgba(232,201,122,0), rgba(232,201,122,0.35), rgba(232,201,122,0));
      animation: brahma-shimmer 1.4s ease-in-out infinite; }
    @keyframes brahma-light { to { opacity: 1; } }
    @keyframes brahma-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    @keyframes brahma-rise { to { opacity: 1; transform: none; } }
    @keyframes brahma-sweep { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0% 0; } }
    @keyframes brahma-draw { to { transform: scaleX(1); } }
    @keyframes brahma-shimmer { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #brahma_halo, #brahma_mark, #brahma_rule, #brahma_bar::after { animation: none; }
      #brahma_halo, #brahma_mark { opacity: 1; transform: none; }
      #brahma_rule { transform: none; }
      #brahma_bar::after { display: none; }

<body>
  <canvas id="brahma_canvas"></canvas>
  <script>
    // The download is the wait: show how far the WebAssembly is (the loader's fetch is wrapped
    // so the count comes from the real stream; the bytes still go to the streaming compiler).
    (function () {
      var nativeFetch = window.fetch;
      var mb = function (n) { return (n / 1048576).toFixed(1); };
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        var p = nativeFetch.apply(this, arguments);
        if (!/_bg\.wasm($|\?)/.test(url)) return p;
        return p.then(function (res) {
          var text = document.getElementById('brahma_progress');
          var bar = document.getElementById('brahma_bar_fill');
          if (!res.ok || !res.body || !text) return res;
          var total = +res.headers.get('content-length') || 0;
          var got = 0;
          var reader = res.body.getReader();
          var stream = new ReadableStream({
            pull: function (c) {
              return reader.read().then(function (r) {
                if (r.done) { text.textContent = 'starting…'; if (bar) bar.style.width = '100%'; c.close(); return; }
                got += r.value.length;
                // A compressed transfer reports its compressed length: never claim more than all of it.
                var share = total ? Math.min(got / total, 1) : 0;
                text.textContent = total ? mb(got) + ' of ' + mb(total) + ' MB' : mb(got) + ' MB';
                if (bar) bar.style.width = (share * 100).toFixed(0) + '%';
                c.enqueue(r.value);
              });
            }
          });
          return new Response(stream, { status: res.status, statusText: res.statusText, headers: res.headers });
        });
      };
    })();
    // Offline support and "install app": the service worker caches this page and its wasm.
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).catch(() => {}); });
    }
  </script>
  <div id="brahma_loading" role="status" aria-live="polite">
    <div id="brahma_halo" aria-hidden="true"></div>
    <p id="brahma_mark" aria-hidden="true">brahma</p>
    <div id="brahma_rule" aria-hidden="true"></div>
    <p id="brahma_word">loading brahma</p>
    <div id="brahma_bar" aria-hidden="true"><div id="brahma_bar_fill"></div></div>
    <p id="brahma_progress">&nbsp;</p>
    <p id="brahma_stalled">This is taking longer than usual. If brahma doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
